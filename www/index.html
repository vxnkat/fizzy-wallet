const pick=k=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=k=='av'?256:720,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S[k]=c.toDataURL('image/jpeg',.82);save();render()};im.src=r.result};r.readAsDataURL(f)};i.click()};
function setPin(){sheet(S.pin?'Change PIN':'Set PIN',()=>[{k:'p',l:'New PIN, 4-8 digits (leave empty to remove)',t:'password'}],v=>{if(v.p&&!/^\d{4,8}$/.test(v.p)){toast('Use 4-8 digits');return false}S.pin=v.p||'';toast(S.pin?'PIN set':'PIN removed')})}
function unlock(){if($('#pin').value==S.pin){$('#lk').className='';$('#pin').value=''}else{toast('Wrong PIN');$('#pin').value=''}}
async function toggleRem(){S.rem=!S.rem;if(S.rem&&window.Notification&&Notification.permission=='default'){try{await Notification.requestPermission()}catch(e){}}save();render();toast(S.rem?'Reminders on':'Reminders off')}
function remind(){if(!S.rem)return;const n=new Date().getDate(),d=S.planned.filter(p=>p.day<=n&&!S.tx.some(t=>t.pid==p.id&&t.d.startsWith(ym0())));if(!d.length)return;const m=d.length+' payment(s) due: '+d.map(p=>p.n||cat(p.c).n).join(', ');toast(m);try{if(Notification.permission=='granted')new Notification('Fizzy Wallet',{body:m})}catch(e){}}
function csvOut(){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"',L=['date,type,amount,account,category,title,tags'];S.tx.slice().sort((a,b)=>a.d.localeCompare(b.d)).forEach(t=>L.push([t.d,t.t,t.a,q(acc(t.f).name),q(t.t=='transfer'?acc(t.to).name:cat(t.c).n),q(t.n),q((t.g||[]).join(';'))].join(',')));try{navigator.clipboard.writeText(L.join('\n'));toast('CSV copied')}catch(e){toast('Copy not available here')}}
const csvRow=l=>{const o=[];let c='',q=0;for(let i=0;i<l.length;i++){const h=l[i];if(h=='"'){if(q&&l[i+1]=='"'){c+='"';i++}else q=!q}else if(h==','&&!q){o.push(c);c=''}else c+=h}o.push(c);return o};
function csvIn(){sheet('Import CSV',()=>[{k:'j',l:'Paste rows: date,type,amount,account,category,title,tags',t:'area'}],v=>{let k=0;const A=nm=>{let x=S.accounts.find(z=>z.name==nm);if(!x){x={id:uid(),name:nm||'Imported',o:0,c:COL[S.accounts.length%8],inc:true};S.accounts.push(x)}return x.id};for(const l of v.j.split(/\r?\n/)){const[d,ty,a,an,cn,n,g]=csvRow(l);if(!/^\d{4}-\d\d-\d\d$/.test(d)||!['income','expense','transfer'].includes(ty)||!(+a>0))continue;const t={id:uid(),t:ty,a:+a,f:A(an),n,g:pg((g||'').replace(/;/g,',')),d};if(ty=='transfer')t.to=A(cn);else{let c=S.cats.find(z=>z.n==cn);if(!c){c={id:uid(),n:cn||'Other',i:'🏷️',k:'both',c:COL[S.cats.length%8]};S.cats.push(c)}t.c=c.id}S.tx.push(t);k++}toast(k+' imported')})}
theme();render();if(S.pin)$('#lk').className='on';remind();
